# Wedding Hub — production stack (Cloudflare Tunnel + ghcr.io image)
#
# Network model (changed from upstream):
#   - `br0`      ← Caddy attaches here with static IP 192.168.50.25.
#                  Cloudflared (already on br0 with its own LAN IP) reaches
#                  Caddy directly via this IP. No host port mapping.
#   - `internal` ← caddy + web + db + backup. Egress allowed (web needs
#                  outbound for Resend SMTP).
#
# Hardening (unchanged from upstream):
#   - web runs as UID 1000, read-only FS, no-new-privileges, cap_drop ALL
#   - db never binds to a host port
#   - JSON log driver capped at 10 MB × 3 files per service
#
# Bind-mount paths use absolute /mnt/user/appdata/wedding-hub/ rather than
# relative ./ — Compose Manager Plus stores stack YAML on /boot/ (USB key),
# and we don't want bind mounts living there.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    # Also listens on :8090 — the LAN-only MCP listener (see caddy/Caddyfile). br0 macvlan exposes it directly; no `ports:` mapping needed.
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /mnt/user/appdata/wedding-hub/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      br0:
        ipv4_address: 192.168.50.25
      internal: {}
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required (e.g. wedding.spencer-net.com)}
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  web:
    # Pull the CI-built image from GHCR. `pull_policy: always` so a `compose up`
    # always grabs the latest :dev tag — no manual `docker pull` step.
    image: ghcr.io/spacetoast1738/wedding-hub:dev
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m
      - /app/.next/cache:rw,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wedding:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/wedding_hub?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required (openssl rand -base64 32)}
      AUTH_URL: https://${DOMAIN:?DOMAIN required}
      AUTH_TRUST_HOST: "true"
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:?AUTH_ALLOWED_EMAILS required}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Wedding Hub <noreply@spencer-net.com>}
      WEDDING_DATE: ${WEDDING_DATE:-2026-09-26T14:00:00Z}
      # Spotify integration. Optional — leaving these blank disables the
      # Sync UI on the Songs page and shows the "Not configured" chip in
      # Settings → Spotify integration. The `:-` default ensures compose
      # doesn't error when they're absent from .env.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # MCP server (v2.7.0). Kill-switch: "false" disables /api/mcp.
      MCP_ENABLED: "${MCP_ENABLED:-true}"
      # Host-header allowlist for the :8090 LAN listener (see caddy/Caddyfile).
      MCP_LAN_HOST: "${MCP_LAN_HOST:-192.168.50.25:8090}"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # No `user:` directive — postgres:16-alpine's built-in `postgres` user is
    # UID 70. Forcing 999:999 (or any non-70 UID) makes `initdb` fail with
    # "could not change permissions of directory ... Operation not permitted".
    networks:
      - internal
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: wedding_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_hub"]
      # initdb's shutdown checkpoint can take ~22s on a slow Unraid array
      # (sync=21s observed on first boot). 60s start_period + 10 retries gives
      # the orchestrator ample time before declaring the container unhealthy.
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    logging: *default-logging
    user: "1000:1000"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: wedding_hub
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "12"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - /mnt/user/appdata/wedding-hub/backups:/backups
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  # Existing Unraid macvlan network (where cloudflared also lives).
  br0:
    external: true
  # Internal compose bridge for service-to-service traffic. Egress allowed
  # so the web container can reach Resend's SMTP endpoint.
  internal:
    driver: bridge
